<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="static/ol.css">
    <script src="static/ol.js"></script>
    <style>
        :root {
            --ink: #171a21;
            --ink-soft: #6b7280;
            --line: #e5e7eb;
            --line-soft: #eef0f3;
            --surface: #ffffff;
            --surface-sunken: #f4f5f7;
            --accent: #4f46e5;
            --accent-strong: #4338ca;
            --accent-tint: #eef0fd;
            --danger: #e11d48;
            --danger-strong: #be123c;
            --success: #059669;
            --success-strong: #047857;
            --success-flat: #9ca3af;
            --unsaved: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
            position: relative;
        }

        /* Pulsující indikátor neuložených změn */
        #unsaved-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--unsaved);
            opacity: 0;
            transform: scaleY(0.6);
            transform-origin: top;
            transition: opacity .25s ease, transform .25s ease;
            z-index: 1000;
            pointer-events: none;
        }
        #unsaved-bar.active {
            opacity: 1;
            transform: scaleY(1);
            animation: unsaved-pulse 1.7s ease-in-out infinite;
        }
        @keyframes unsaved-pulse {
            0%, 100% { box-shadow: 0 0 6px 0 rgba(239,68,68,.45); opacity: .6; }
            50% { box-shadow: 0 0 14px 2px rgba(239,68,68,.85); opacity: 1; }
        }

        #toolbar {
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            box-sizing: border-box;
            font-size: 13px;
            color: var(--ink);
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
            border-radius: 10px;
        }
        .btn-group + .btn-group { border-left: 1px solid var(--line-soft); padding-left: 12px; }

        .group-label {
            font-weight: 600;
            font-size: 12px;
            color: var(--ink-soft);
            margin-right: 2px;
            white-space: nowrap;
        }

        button {
            background-color: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 12.5px;
            line-height: 1.2;
            transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .08s ease;
        }
        button:hover { background-color: var(--surface-sunken); border-color: #d5d8de; }
        button:active { transform: scale(0.97); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        button.primary { background-color: var(--accent); color: #fff; border-color: var(--accent); }
        button.primary:hover { background-color: var(--accent-strong); border-color: var(--accent-strong); }

        button.danger { background-color: var(--surface); color: var(--danger); border-color: #f3c6ce; }
        button.danger:hover { background-color: #fdf1f3; border-color: var(--danger); }

        button.success { background-color: var(--success); color: #fff; border-color: var(--success); }
        button.success:hover { background-color: var(--success-strong); border-color: var(--success-strong); }
        button.success:disabled { background-color: var(--success-flat); border-color: var(--success-flat); opacity: 0.55; }

        button#prev-btn, button#next-btn {
            padding: 6px 9px;
            color: var(--ink-soft);
        }

        .toggle-switch {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: var(--surface-sunken);
        }
        .toggle-btn {
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 6px 12px;
            font-size: 12.5px;
            color: var(--ink-soft);
        }
        .toggle-btn:hover { background: #eceef1; }
        .toggle-btn.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .toggle-btn.active:hover { background: var(--accent-strong); }

        .active-badge {
            font-size: 12.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--accent-tint);
            color: var(--accent-strong);
            min-width: 78px;
            text-align: center;
        }

        .info { font-size: 11.5px; color: var(--ink-soft); margin-left: auto; }

        #unsaved-indicator {
            font-size: 12.5px;
            color: var(--danger-strong);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        #unsaved-indicator::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--unsaved);
            animation: dot-pulse 1.4s ease-in-out infinite;
        }
        @keyframes dot-pulse {
            0%, 100% { opacity: .5; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1); }
        }

        #map { width: 100%; height: 550px; background: var(--surface-sunken); }
    </style>
</head>
<body>
    <div id="unsaved-bar"></div>
    <div id="toolbar">
        <div class="btn-group">
            <div class="toggle-switch">
                <button id="tool-poly-btn" class="toggle-btn active">🔲 Polygon</button>
                <button id="tool-line-btn" class="toggle-btn">📏 Line</button>
            </div>
        </div>

        <div class="btn-group">
            <button id="add-btn" class="primary">➕ New</button>
            <button id="undo-btn" title="Undo last edit">↩️ Undo</button>
            <button id="prev-btn">◀</button>
            <span id="active-badge" class="active-badge">#1 out of 1</span>
            <button id="next-btn">▶</button>
            <button id="del-btn" class="danger">🗑️ Delete</button>
        </div>

        <div class="btn-group">
            <span class="group-label">Show:</span>
            <div class="toggle-switch">
                <button id="view-all-btn" class="toggle-btn active">All</button>
                <button id="view-single-btn" class="toggle-btn">Selected</button>
            </div>
        </div>

        <div class="btn-group">
            <button id="confirm-btn" class="success" hidden>✅ Confirm</button>
            <span id="unsaved-indicator" hidden>Unsaved changes</span>
        </div>

        <span class="info">(Shift + Click on point = delete point)</span>
    </div>
    <div id="map"></div>

    <script>
        function sendMessageToStreamlit(type, data) {
            window.parent.postMessage(Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data), "*");
        }

        function setComponentValue(value) {
            sendMessageToStreamlit("streamlit:setComponentValue", { value: value });
        }

        function setFrameHeight(height) {
            sendMessageToStreamlit("streamlit:setFrameHeight", { height: height });
        }

        let map, source, drawInteraction, modifyInteraction, selectInteraction;
        let polygons = []; 
        let lines = [];    
        let isInitialized = false;
        let imageToken;
        let confirmMode = false;
        let dirty = false;
        
        // HISTORIE PRO UNDO
        let historyStack = [];
        const MAX_HISTORY = 30;

        let activeTool = 'polygon';
        let activePolygonIndex = 0;
        let activeLineIndex = 0;
        let polyViewMode = 'all';  
        let lineViewMode = 'all';  

        // Uložení aktuálního stavu do historie
        function pushHistoryState() {
            const polyCoords = polygons.map(f => f.getGeometry().getCoordinates());
            const lineCoords = lines.map(f => f.getGeometry().getCoordinates());

            const state = {
                polygons: JSON.parse(JSON.stringify(polyCoords)),
                lines: JSON.parse(JSON.stringify(lineCoords)),
                activeTool: activeTool,
                activePolygonIndex: activePolygonIndex,
                activeLineIndex: activeLineIndex
            };

            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            }
            updateUndoButtonState();
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undo-btn');
            if (undoBtn) {
                undoBtn.disabled = historyStack.length === 0;
            }
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;

            const previousState = historyStack.pop();

            // Vyčistíme staré prvky ze zdroje
            source.clear();
            polygons = [];
            lines = [];

            // Obnovíme polygony
            previousState.polygons.forEach((coords, idx) => {
                const feat = new ol.Feature({
                    geometry: new ol.geom.Polygon(coords)
                });
                feat.set('type', 'polygon');
                feat.set('index', idx);
                polygons.push(feat);
                source.addFeature(feat);
            });

            // Obnovíme čáry
            previousState.lines.forEach((coords, idx) => {
                const feat = new ol.Feature({
                    geometry: new ol.geom.LineString(coords)
                });
                feat.set('type', 'line');
                feat.set('index', idx);
                lines.push(feat);
                source.addFeature(feat);
            });

            activeTool = previousState.activeTool;
            activePolygonIndex = Math.min(previousState.activePolygonIndex, Math.max(0, polygons.length - 1));
            activeLineIndex = Math.min(previousState.activeLineIndex, Math.max(0, lines.length - 1));

            updateUIControls();
            updateUndoButtonState();
            commitChange();
        }

        function sendDataToStreamlit() {
            let polyData = polygons.map(f => {
                const geom = f.getGeometry();
                if (!geom) return [];
                const rawCoords = geom.getCoordinates()[0] || [];
                // Neafinujeme na celé px: zaokrouhlení může u husto vedle
                // sebe ležících vrcholů způsobit jejich splynutí a vytvořit
                // samo-protínající se polygon.
                return rawCoords.slice(0, -1).map(pt => [pt[0], pt[1]]);
            });

            let lineData = lines.map(f => {
                const geom = f.getGeometry();
                if (!geom) return [];
                const rawCoords = geom.getCoordinates() || [];
                return rawCoords.map(pt => [pt[0], pt[1]]);
            });

            setComponentValue({
                active_tool: activeTool,
                active_polygon_index: activePolygonIndex,
                active_line_index: activeLineIndex,
                poly_view_mode: polyViewMode,
                line_view_mode: lineViewMode,
                polygons: polyData,
                lines: lineData,
                image_token: imageToken
            });
        }

        // In "confirm" mode, edits only accumulate locally in the browser;
        // they are sent to Python once the user clicks the Confirm button.
        // In the default (immediate) mode every edit is sent right away.
        function refreshConfirmUI() {
            const btn = document.getElementById('confirm-btn');
            const indicator = document.getElementById('unsaved-indicator');
            const unsavedBar = document.getElementById('unsaved-bar');
            btn.hidden = !confirmMode;
            indicator.hidden = !confirmMode;
            btn.disabled = !dirty;
            indicator.style.visibility = dirty ? 'visible' : 'hidden';
            if (unsavedBar) unsavedBar.classList.toggle('active', confirmMode && dirty);
        }

        function commitChange() {
            if (confirmMode) {
                dirty = true;
                refreshConfirmUI();
            } else {
                sendDataToStreamlit();
            }
        }

        function updateUIControls() {
            document.getElementById('tool-poly-btn').classList.toggle('active', activeTool === 'polygon');
            document.getElementById('tool-line-btn').classList.toggle('active', activeTool === 'line');

            const badge = document.getElementById('active-badge');
            
            if (activeTool === 'polygon') {
                if (polygons.length > 0) {
                    badge.textContent = `#${activePolygonIndex + 1} out of ${polygons.length}`;
                } else {
                    badge.textContent = "None";
                }
                document.getElementById('view-all-btn').classList.toggle('active', polyViewMode === 'all');
                document.getElementById('view-single-btn').classList.toggle('active', polyViewMode === 'single');
            } else {
                if (lines.length > 0) {
                    badge.textContent = `#${activeLineIndex + 1} out of ${lines.length}`;
                } else {
                    badge.textContent = "None";
                }
                document.getElementById('view-all-btn').classList.toggle('active', lineViewMode === 'all');
                document.getElementById('view-single-btn').classList.toggle('active', lineViewMode === 'single');
            }

            if (selectInteraction) {
                const selFeatures = selectInteraction.getFeatures();
                selFeatures.clear();
                let currentFeature = null;
                if (activeTool === 'polygon' && polygons[activePolygonIndex]) {
                    currentFeature = polygons[activePolygonIndex];
                } else if (activeTool === 'line' && lines[activeLineIndex]) {
                    currentFeature = lines[activeLineIndex];
                }
                if (currentFeature) {
                    selFeatures.push(currentFeature);
                }
            }

            if (source) source.changed();
        }

        // Style objects are stateless once created for a given
        // (type, isActive) combination - OpenLayers calls the geometry
        // function fresh per-feature/per-render anyway, so it's safe (and
        // much cheaper) to build each variant once and reuse it, instead of
        // allocating a new Style/Fill/Stroke/Circle tree for every single
        // feature on every redraw (which happens continuously while
        // dragging a vertex).
        const STYLE_CACHE = {};

        function polygonVertexGeometry(f) {
            const geom = f.getGeometry();
            const coords = geom.getCoordinates()[0] || [];
            return new ol.geom.MultiPoint(coords.slice(0, -1));
        }

        function lineVertexGeometry(f) {
            return new ol.geom.MultiPoint(f.getGeometry().getCoordinates());
        }

        function buildStyle(kind, isActive) {
            if (kind === 'polygon') {
                return [
                    new ol.style.Style({
                        fill: new ol.style.Fill({
                            color: isActive ? 'rgba(13, 110, 253, 0.25)' : 'rgba(108, 117, 125, 0.15)'
                        }),
                        stroke: new ol.style.Stroke({
                            color: isActive ? '#0d6efd' : '#6c757d',
                            width: isActive ? 3 : 2
                        }),
                    }),
                    new ol.style.Style({
                        image: new ol.style.Circle({
                            radius: isActive ? 6 : 4,
                            fill: new ol.style.Fill({ color: isActive ? '#0d6efd' : '#ffffff' }),
                            stroke: new ol.style.Stroke({ color: isActive ? '#ffffff' : '#0d6efd', width: 2 }),
                        }),
                        geometry: polygonVertexGeometry
                    })
                ];
            }
            return [
                new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: isActive ? '#198754' : '#20c997',
                        width: isActive ? 4 : 2.5
                    })
                }),
                new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: isActive ? 6 : 4,
                        fill: new ol.style.Fill({ color: isActive ? '#198754' : '#ffffff' }),
                        stroke: new ol.style.Stroke({ color: isActive ? '#ffffff' : '#198754', width: 2 }),
                    }),
                    geometry: lineVertexGeometry
                })
            ];
        }

        function getCachedStyle(kind, isActive) {
            const key = kind + ':' + isActive;
            if (!STYLE_CACHE[key]) STYLE_CACHE[key] = buildStyle(kind, isActive);
            return STYLE_CACHE[key];
        }

        function getFeatureStyle(feature) {
            const type = feature.get('type');
            const index = feature.get('index');

            if (type === 'polygon') {
                if (polyViewMode === 'single' && index !== activePolygonIndex) {
                    return null; 
                }
                const isActive = (activeTool === 'polygon' && index === activePolygonIndex);
                return getCachedStyle('polygon', isActive);
            }

            if (type === 'line') {
                if (lineViewMode === 'single' && index !== activeLineIndex) {
                    return null; 
                }
                const isActive = (activeTool === 'line' && index === activeLineIndex);
                return getCachedStyle('line', isActive);
            }
        }

        function setupInteractions() {
            if (drawInteraction) map.removeInteraction(drawInteraction);
            if (modifyInteraction) map.removeInteraction(modifyInteraction);
            if (selectInteraction) map.removeInteraction(selectInteraction);

            selectInteraction = new ol.interaction.Select({
                // ÚPRAVA: Vybereme objekt jen při kliknutí BEZ klávesy Shift
                condition: function(mapBrowserEvent) {
                    return ol.events.condition.click(mapBrowserEvent) && 
                        !ol.events.condition.shiftKeyOnly(mapBrowserEvent);
                },
                style: function(feature) {
                    return getFeatureStyle(feature);
                },
                filter: function(feature) {
                    const type = feature.get('type');
                    const idx = feature.get('index');
                    if (type === 'polygon' && polyViewMode === 'single' && idx !== activePolygonIndex) return false;
                    if (type === 'line' && lineViewMode === 'single' && idx !== activeLineIndex) return false;
                    return true;
                }
            });

            selectInteraction.on('select', function(e) {
                const selected = e.selected[0];
                if (selected) {
                    const type = selected.get('type');
                    const idx = selected.get('index');
                    if (type === 'polygon') {
                        activeTool = 'polygon';
                        activePolygonIndex = idx;
                    } else if (type === 'line') {
                        activeTool = 'line';
                        activeLineIndex = idx;
                    }
                    updateUIControls();
                    commitChange();
                }
            });

            map.addInteraction(selectInteraction);

            modifyInteraction = new ol.interaction.Modify({
                source: source,
                deleteCondition: function(event) {
                    return ol.events.condition.singleClick(event) && ol.events.condition.shiftKeyOnly(event);
                }
            });

            modifyInteraction.on('modifystart', function() {
                pushHistoryState();
            });

            modifyInteraction.on('modifyend', commitChange);
            map.addInteraction(modifyInteraction);
        }

        function startDrawing() {
            if (drawInteraction) map.removeInteraction(drawInteraction);

            drawInteraction = new ol.interaction.Draw({
                source: source,
                type: activeTool === 'polygon' ? 'Polygon' : 'LineString',
                maxPoints: activeTool === 'line' ? 2 : undefined
            });

            drawInteraction.on('drawstart', function() {
                // Uložit stav před začátkem kreslení
                pushHistoryState();
            });

            drawInteraction.on('drawend', function(evt) {
                const feature = evt.feature;
                if (activeTool === 'polygon') {
                    const newIdx = polygons.length;
                    feature.set('type', 'polygon');
                    feature.set('index', newIdx);
                    polygons.push(feature);
                    activePolygonIndex = newIdx;
                } else {
                    const newIdx = lines.length;
                    feature.set('type', 'line');
                    feature.set('index', newIdx);
                    lines.push(feature);
                    activeLineIndex = newIdx;
                }

                setTimeout(() => {
                    map.removeInteraction(drawInteraction);
                    updateUIControls();
                    commitChange();
                }, 50);
            });

            map.addInteraction(drawInteraction);
        }

        function resetSceneForImage(imageDataUrl, width, height, maxHeight, initialPolygons, initialLines, defaultPolyView, defaultLineView, defaultTool) {
            const mapElement = document.getElementById('map');
            const limitHeight = maxHeight || 550;
            const canvasHeight = Math.min(height, limitHeight);
            mapElement.style.height = canvasHeight + 'px';
            setFrameHeight(canvasHeight + 55);

            // Tear down any previous map instance (e.g. a different image
            // was passed in) before rebuilding from scratch.
            if (map) {
                map.setTarget(null);
                map = null;
            }

            polyViewMode = defaultPolyView || 'all';
            lineViewMode = defaultLineView || 'all';
            activeTool = defaultTool || 'polygon';
            activePolygonIndex = 0;
            activeLineIndex = 0;
            historyStack = [];
            dirty = false;

            const extent = [0, 0, width, height];
            const projection = new ol.proj.Projection({
                code: 'image',
                units: 'pixels',
                extent: extent,
            });

            source = new ol.source.Vector();

            const vector = new ol.layer.Vector({
                source: source,
                style: getFeatureStyle
            });

            map = new ol.Map({
                target: 'map',
                layers: [
                    new ol.layer.Image({
                        source: new ol.source.ImageStatic({
                            url: imageDataUrl,
                            projection: projection,
                            imageExtent: extent,
                        }),
                    }),
                    vector
                ],
                view: new ol.View({
                    projection: projection,
                    center: ol.extent.getCenter(extent),
                }),
            });

            setTimeout(() => {
                map.updateSize();
                map.getView().fit(extent, { size: map.getSize() });
            }, 100);

            polygons = [];
            lines = [];

            if (initialPolygons && Array.isArray(initialPolygons)) {
                initialPolygons.forEach((polyCoords, idx) => {
                    if (polyCoords.length >= 3) {
                        const closedCoords = [...polyCoords, polyCoords[0]];
                        const feat = new ol.Feature({
                            geometry: new ol.geom.Polygon([closedCoords])
                        });
                        feat.set('type', 'polygon');
                        feat.set('index', idx);
                        polygons.push(feat);
                        source.addFeature(feat);
                    }
                });
            }

            if (initialLines && Array.isArray(initialLines)) {
                initialLines.forEach((lineCoords, idx) => {
                    if (lineCoords.length >= 2) {
                        const feat = new ol.Feature({
                            geometry: new ol.geom.LineString(lineCoords)
                        });
                        feat.set('type', 'line');
                        feat.set('index', idx);
                        lines.push(feat);
                        source.addFeature(feat);
                    }
                });
            }

            setupInteractions();
            updateUIControls();
            updateUndoButtonState();
            refreshConfirmUI();
            isInitialized = true;
        }

        // Same image, just another Streamlit rerun (possibly triggered by
        // this very component). We must NOT reapply poly_view_mode /
        // line_view_mode / active_tool / initial_polygons / initial_lines
        // here: Python's default arguments for those are typically static,
        // so blindly re-applying them on every render would silently
        // overwrite whatever the user just clicked in the browser (e.g.
        // switching to the "Line" tool would immediately get reset back to
        // "Polygon" on the very next rerun). Only resizing/height and the
        // confirm-mode flag are safe to re-sync unconditionally.
        function applyViewSettings(maxHeight, height) {
            const mapElement = document.getElementById('map');
            const limitHeight = maxHeight || 550;
            const canvasHeight = Math.min(height, limitHeight);
            mapElement.style.height = canvasHeight + 'px';
            setFrameHeight(canvasHeight + 55);
            updateUIControls();
        }

        // Tlačítka pro přepínání nástroje
        document.getElementById('tool-poly-btn').addEventListener('click', () => {
            activeTool = 'polygon';
            updateUIControls();
            commitChange();
        });

        document.getElementById('tool-line-btn').addEventListener('click', () => {
            activeTool = 'line';
            updateUIControls();
            commitChange();
        });

        // Tlačítko Back / Undo
        document.getElementById('undo-btn').addEventListener('click', () => undoLastAction());

        // Akční tlačítka
        document.getElementById('add-btn').addEventListener('click', () => startDrawing());

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (activeTool === 'polygon') {
                if (polygons.length > 0) {
                    activePolygonIndex = (activePolygonIndex - 1 + polygons.length) % polygons.length;
                }
            } else {
                if (lines.length > 0) {
                    activeLineIndex = (activeLineIndex - 1 + lines.length) % lines.length;
                }
            }
            updateUIControls();
            commitChange();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (activeTool === 'polygon') {
                if (polygons.length > 0) {
                    activePolygonIndex = (activePolygonIndex + 1) % polygons.length;
                }
            } else {
                if (lines.length > 0) {
                    activeLineIndex = (activeLineIndex + 1) % lines.length;
                }
            }
            updateUIControls();
            commitChange();
        });

        document.getElementById('del-btn').addEventListener('click', () => {
            if (activeTool === 'polygon') {
                if (polygons.length > 0 && activePolygonIndex < polygons.length) {
                    pushHistoryState(); // Uložit stav před smazáním
                    const removed = polygons.splice(activePolygonIndex, 1)[0];
                    source.removeFeature(removed);
                    polygons.forEach((f, idx) => f.set('index', idx));
                    activePolygonIndex = Math.max(0, activePolygonIndex - 1);
                }
            } else {
                if (lines.length > 0 && activeLineIndex < lines.length) {
                    pushHistoryState(); // Uložit stav před smazáním
                    const removed = lines.splice(activeLineIndex, 1)[0];
                    source.removeFeature(removed);
                    lines.forEach((f, idx) => f.set('index', idx));
                    activeLineIndex = Math.max(0, activeLineIndex - 1);
                }
            }
            updateUIControls();
            commitChange();
        });

        document.getElementById('view-all-btn').addEventListener('click', () => {
            if (activeTool === 'polygon') polyViewMode = 'all';
            else lineViewMode = 'all';
            updateUIControls();
            commitChange();
        });

        document.getElementById('view-single-btn').addEventListener('click', () => {
            if (activeTool === 'polygon') polyViewMode = 'single';
            else lineViewMode = 'single';
            updateUIControls();
            commitChange();
        });

        document.getElementById('confirm-btn').addEventListener('click', () => {
            sendDataToStreamlit();
            dirty = false;
            refreshConfirmUI();
        });

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                const args = event.data.args;
                confirmMode = !!args.confirm_mode;

                // Compare the small sha256 token instead of e.g. the full
                // base64 image data - and use it to decide whether this is
                // genuinely a new/changed image (full rebuild needed) or
                // just another rerun of the same image (local edits must be
                // preserved).
                const tokenChanged = imageToken !== args.image_token;
                imageToken = args.image_token;

                if (!isInitialized || tokenChanged) {
                    resetSceneForImage(
                        args.image_data_url,
                        args.width,
                        args.height,
                        args.max_height,
                        args.initial_polygons,
                        args.initial_lines,
                        args.poly_view_mode,
                        args.line_view_mode,
                        args.active_tool
                    );
                } else {
                    applyViewSettings(args.max_height, args.height);
                }
                refreshConfirmUI();
            }
        });

        sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    </script>
</body>
</html>
